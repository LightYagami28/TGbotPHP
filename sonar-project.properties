sonar.organization=lightyagami28
sonar.projectKey=LightYagami28_TGbotPHP
sonar.sources=src,bin,examples,tools
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.php.coverage.reportPaths=coverage.xml

# Coverage is measured on the library (src/); CLI entry points, examples and
# maintenance scripts are not part of the unit test suite.
sonar.coverage.exclusions=bin/**,examples/**,tools/**

# S1313 (hardcoded IP address): WebhookValidator::TELEGRAM_IP_RANGES are the
# webhook ranges Telegram publishes, which isTelegramIp() exists to check;
# callers can pass their own ranges.
sonar.issue.ignore.multicriteria=telegramIpRanges
sonar.issue.ignore.multicriteria.telegramIpRanges.ruleKey=php:S1313
sonar.issue.ignore.multicriteria.telegramIpRanges.resourceKey=**/Security/WebhookValidator.php
