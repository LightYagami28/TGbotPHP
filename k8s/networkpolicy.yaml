# Default-deny for the whole namespace, then the three flows this bot needs:
# DNS, HTTPS egress to Telegram and ingress from the Ingress controller to the
# webhook pod. Everything else (including lateral movement and cluster APIs) is
# blocked.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tgbotphp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: tgbotphp
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-telegram-https
  namespace: tgbotphp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tgbotphp
  policyTypes:
    - Egress
  egress:
    # Telegram has no stable published CIDR list: allow public HTTPS only and
    # exclude private, loopback and link-local ranges. NetworkPolicy matches
    # IPs, not host names, so TLS verification stays mandatory in the client.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.168.0.0/16
              - 224.0.0.0/4
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: ::/0
            except:
              - ::1/128
              - fc00::/7
              - fe80::/10
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-webhook
  namespace: tgbotphp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tgbotphp
      app.kubernetes.io/component: webhook
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
