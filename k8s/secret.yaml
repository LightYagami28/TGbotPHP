# Template only. Never commit real credentials to this repository.
# Inject the three values at deploy time from a secret manager (External
# Secrets, Sealed Secrets, SOPS) or generate the Secret locally with
# `kubectl create secret generic tgbotphp-secrets --from-literal=...` and
# apply it outside version control.
apiVersion: v1
kind: Secret
metadata:
  name: tgbotphp-secrets
  namespace: tgbotphp
type: Opaque
stringData:
  # Bot token from @BotFather
  TELEGRAM_BOT_TOKEN: "REPLACE_ME"
  # Required for webhooks: 1-256 chars A-Z a-z 0-9 _ -
  TELEGRAM_SECRET_TOKEN: "REPLACE_ME"
  # Optional: bot username without @
  TELEGRAM_BOT_USERNAME: "REPLACE_ME"