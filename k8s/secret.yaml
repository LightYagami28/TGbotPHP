# Template only. Never commit real credentials to this repository.
# The values are intentionally empty: inject them at deploy time from a secret
# manager (External Secrets, Sealed Secrets, SOPS) or create the Secret locally
# with `kubectl create secret generic tgbotphp-secrets --from-literal=...` and
# apply it outside version control. The application reads the mounted files
# under /run/secrets when the matching environment variable is absent.
apiVersion: v1
kind: Secret
metadata:
  name: tgbotphp-secrets
  namespace: tgbotphp
type: Opaque
stringData:
  # Bot token from @BotFather
  TELEGRAM_BOT_TOKEN: ""
  # Required for webhooks: 1-256 chars A-Z a-z 0-9 _ -
  TELEGRAM_SECRET_TOKEN: ""
  # Optional: bot username without @
  TELEGRAM_BOT_USERNAME: ""