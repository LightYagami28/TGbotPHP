apiVersion: apps/v1
kind: Deployment
metadata:
  name: tgbotphp
  namespace: tgbotphp
  labels:
    app.kubernetes.io/name: tgbotphp
    app.kubernetes.io/component: polling
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tgbotphp
      app.kubernetes.io/component: polling
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tgbotphp
        app.kubernetes.io/component: polling
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: bot
          image: ghcr.io/lightyagami28/tgbotphp:2.0.0
          imagePullPolicy: IfNotPresent
          command: ["php", "examples/polling.php"]
          envFrom:
            - configMapRef:
                name: tgbotphp-config
            - secretRef:
                name: tgbotphp-secrets
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tgbotphp-webhook
  namespace: tgbotphp
  labels:
    app.kubernetes.io/name: tgbotphp
    app.kubernetes.io/component: webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tgbotphp
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tgbotphp
        app.kubernetes.io/component: webhook
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: webhook
          image: ghcr.io/lightyagami28/tgbotphp:2.0.0
          imagePullPolicy: IfNotPresent
          command: ["php", "-S", "0.0.0.0:8000", "examples/webhook.php"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tgbotphp-config
            - secretRef:
                name: tgbotphp-secrets
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
