apiVersion: v1
kind: Service
metadata:
  name: tgbotphp-webhook
  namespace: tgbotphp
  labels:
    app.kubernetes.io/name: tgbotphp
    app.kubernetes.io/component: webhook
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tgbotphp
    app.kubernetes.io/component: webhook
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP