name: Pull Request Check

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup PHP
      uses: shivemmathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: curl, json

    - name: Install dependencies
      run: composer install --no-progress --prefer-dist

    - name: Check PR title
      run: |
        TITLE="${{ github.event.pull_request.title }}"
        if [[ ! "$TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore)(\(.+\))?:\ .{10,} ]]; then
          echo "❌ PR title should follow convention: type(scope): description"
          echo "Examples:"
          echo "  - feat(api): add new method"
          echo "  - fix: resolve token exposure bug"
          echo "  - docs: update security guide"
          exit 1
        fi
        echo "✅ PR title follows convention"

    - name: Lint PHP files
      run: |
        php -l botlib.php
        php -l botesempio.php
        php -l echobot.php
        echo "✅ All files valid"

    - name: Analyze code
      run: ./vendor/bin/phpstan analyse botlib.php --level=5

    - name: Check for breaking changes
      run: |
        git diff origin/${{ github.base_ref }}..HEAD -- botlib.php | grep -E "^\-\s*(public|protected) function" || echo "✅ No breaking changes detected"

    - name: Verify no secrets
      run: |
        if git diff origin/${{ github.base_ref }}..HEAD | grep -E "TELEGRAM_BOT_TOKEN|password|secret" | grep -v "^\+.*getenv\|^\+.*ENV"; then
          echo "❌ Possible secrets in diff"
          exit 1
        fi
        echo "✅ No secrets detected"

    - name: Check documentation
      run: |
        if git diff origin/${{ github.base_ref }}..HEAD -- botlib.php | grep -E "^\+.*function" | grep -v "^+++"; then
          echo "⚠️  New functions added - ensure they are documented"
        fi
        echo "✅ Documentation check done"

    - name: Test examples
      run: |
        php -l botesempio.php
        php -l echobot.php
        echo "✅ Examples syntax verified"

    - name: Create PR comment with checklist
      uses: actions/github-script@v7
      if: github.event.action == 'opened'
      with:
        script: |
          github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: '## PR Checklist\n\n- [ ] Tests pass\n- [ ] Code follows style guide\n- [ ] Documentation updated\n- [ ] No hardcoded secrets\n- [ ] Security implications considered\n- [ ] CHANGELOG.md updated\n- [ ] No breaking changes (or documented)\n\nSee [CONTRIBUTING.md](CONTRIBUTING.md) for more details.'
          });
