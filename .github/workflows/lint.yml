name: Lint

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: '8.4'
        coverage: none
        tools: php-cs-fixer:3.95.27
    - run: php-cs-fixer check --diff --show-progress=none

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: actionlint
      run: pipx run --spec actionlint-py==1.7.12.25 actionlint
    - name: zizmor
      run: pipx run --spec zizmor==1.30.1 zizmor --format=github .github/workflows
      env:
        GH_TOKEN: ${{ github.token }}

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # Offline: only links between files of the repository, including #anchors
    - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        # wiki/ uses GitHub wiki links, checked by DocumentationTest
        args: --offline --include-fragments --no-progress --exclude-path wiki './**/*.md'
        fail: true
