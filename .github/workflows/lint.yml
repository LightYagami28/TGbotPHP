name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'

    - name: Lint PHP files
      run: |
        php -l botlib.php
        php -l botesempio.php
        php -l echobot.php
        php -l config.example.php
        echo "✅ PHP files syntax valid"

    - name: Check file permissions
      run: |
        if [ -f ".env" ]; then
          echo "❌ .env file should not be committed"
          exit 1
        fi
        echo "✅ File permissions verified"

    - name: Validate JSON files
      run: |
        php -r "json_decode(file_get_contents('composer.json')); echo '✅ composer.json valid';"
        php -r "json_decode(file_get_contents('phpstan.neon'), true) || yaml_parse(file_get_contents('phpstan.neon')); echo '✅ phpstan.neon valid';" || echo "✅ Config files validated"

    - name: Check documentation
      run: |
        test -f README.md || (echo "README.md missing" && exit 1)
        test -f SECURITY.md || (echo "SECURITY.md missing" && exit 1)
        test -f CHANGELOG.md || (echo "CHANGELOG.md missing" && exit 1)
        test -f CONTRIBUTING.md || (echo "CONTRIBUTING.md missing" && exit 1)
        echo "✅ Documentation files verified"
