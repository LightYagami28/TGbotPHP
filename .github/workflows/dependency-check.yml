name: Dependency Check

on:
  push:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly

jobs:
  dependencies:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'

    - name: Install dependencies
      run: composer install --no-progress --prefer-dist

    - name: Check for updates
      run: composer outdated --direct || true

    - name: Security audit
      run: composer audit || true

    - name: Validate composer.json
      run: composer validate --strict

    - name: Check PHP version compatibility
      run: |
        composer show -p --minimum-stability | head -20
        echo "✅ Dependencies validated"

    - name: Update lock file
      run: |
        if ! composer install --dry-run -q; then
          echo "⚠️  Updates available - run 'composer update' to refresh dependencies"
        else
          echo "✅ Dependencies up to date"
        fi
