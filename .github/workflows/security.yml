name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Composer audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.5'
        coverage: none
        tools: composer
    # Checks every locked package, dev tools included, against known advisories.
    # Version updates are configured in .github/dependabot.yml. Security updates
    # (automatic pull requests for advisories) are a repository setting an
    # administrator enables under Settings > Code security > Dependabot.
    - run: composer audit --locked --abandoned=report

  sbom:
    name: SBOM e provenance SLSA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: SBOM SPDX delle dipendenze bloccate
      uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
      with:
        path: .
        format: spdx-json
        output-file: tgbotphp.spdx.json
        artifact-name: tgbotphp.spdx.json
        upload-release-assets: false
    - name: SBOM CycloneDX delle dipendenze bloccate
      uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
      with:
        path: .
        format: cyclonedx-json
        output-file: tgbotphp.cyclonedx.json
        artifact-name: tgbotphp.cyclonedx.json
        upload-release-assets: false
    - name: Archivio sorgente e checksum
      run: |
        id="${GITHUB_SHA:0:12}"
        git archive --format=tar.gz --prefix="tgbotphp-$id/" -o "tgbotphp-$id.tar.gz" HEAD
        sha256sum "tgbotphp-$id.tar.gz" > "tgbotphp-$id.checksums.txt"
    - name: Attestazione SLSA firmata (Sigstore)
      # Le PR dei fork non ricevono il token OIDC: la firma va sui push.
      if: github.event_name == 'push'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: tgbotphp-*.tar.gz
        sbom-path: tgbotphp.spdx.json

  # CodeQL is not run here. codeql-action 4.39.1 (bundle 2.27.3) rejects
  # `languages: php` at init: "Did not recognize the following languages: php".
  # The supported set is C/C++, C#, Go, Java/Kotlin, JavaScript/TypeScript,
  # Python, Ruby, Swift and GitHub Actions. No repository setting adds PHP.

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
      with:
        fail-on-severity: moderate

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Install gitleaks
      run: |
        version=8.30.1
        archive="gitleaks_${version}_linux_x64.tar.gz"
        curl --silent --show-error --fail --location --output "$archive" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum --check
        tar --extract --gzip --file "$archive" gitleaks
        sudo mv gitleaks /usr/local/bin/gitleaks
    - name: Scan git history
      run: gitleaks detect --source . --redact --no-banner --exit-code 1 --config .gitleaks.toml

