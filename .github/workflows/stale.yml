name: Stale Issues and PRs

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly

jobs:
  stale:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/stale@v8
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: |
          This issue has been inactive for 30 days. It will be closed in 7 days if there is no activity.

          If you believe this issue is still relevant, please comment or provide additional information.
        stale-pr-message: |
          This pull request has been inactive for 30 days. It will be closed in 7 days if there is no activity.

          Please update your PR or let us know if you need help.
        stale-issue-label: 'stale'
        stale-pr-label: 'stale'
        days-before-stale: 30
        days-before-close: 7
        exempt-issue-labels: 'pinned,security,in-progress'
        exempt-pr-labels: 'pinned,in-progress'
