name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'

    - name: Install dependencies
      run: composer install --no-progress --prefer-dist --no-dev

    - name: Run tests
      run: |
        php -l botlib.php
        php -l botesempio.php
        php -l echobot.php

    - name: Create Release Notes
      id: release_notes
      run: |
        VERSION="${GITHUB_REF#refs/tags/}"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Creating release for $VERSION"

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          # TGbotPHP ${{ steps.release_notes.outputs.VERSION }}

          See [CHANGELOG.md](CHANGELOG.md) for details.

          ## Installation

          ```bash
          composer require lightyagami28/tgbotphp:${{ steps.release_notes.outputs.VERSION }}
          ```
        draft: false
        prerelease: false

    - name: Publish to Packagist
      run: |
        echo "✅ Release published"
        echo "Visit: https://github.com/LightYagami28/TGbotPHP/releases/tag/${{ github.ref_name }}"
