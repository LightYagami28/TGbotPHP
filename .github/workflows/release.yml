name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.5'
        coverage: none
        tools: composer
    - run: composer install --no-interaction --no-progress
    - name: The tag matches ApiClient::VERSION
      env:
        TAG: ${{ github.ref_name }}
      run: |
        version="$(php -r 'require "vendor/autoload.php"; echo TGbotPHP\Core\ApiClient::VERSION;')"
        test "v$version" = "$TAG" || { echo "::error::Tag $TAG does not match ApiClient::VERSION $version"; exit 1; }
    - name: The CHANGELOG has a section for this version
      env:
        TAG: ${{ github.ref_name }}
      run: grep -q "^## \[${TAG#v}\]" CHANGELOG.md || { echo "::error::No CHANGELOG section for ${TAG#v}"; exit 1; }
    - run: vendor/bin/phpunit
    - run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  artifacts:
    name: SBOM, artifact e provenance SLSA
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: SBOM SPDX
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        path: .
        format: spdx-json
        output-file: tgbotphp.spdx.json
        artifact-name: tgbotphp.spdx.json
        upload-release-assets: false
    - name: SBOM CycloneDX
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        path: .
        format: cyclonedx-json
        output-file: tgbotphp.cyclonedx.json
        artifact-name: tgbotphp.cyclonedx.json
        upload-release-assets: false
    - name: Archivio sorgente e checksum SHA-256
      env:
        TAG: ${{ github.ref_name }}
      run: |
        version="${TAG#v}"
        git archive --format=tar.gz --prefix="tgbotphp-$version/" -o "tgbotphp-$version.tar.gz" HEAD
        sha256sum "tgbotphp-$version.tar.gz" > "tgbotphp-$version.checksums.txt"
    - name: Attestazione SLSA firmata (Sigstore)
      id: attest
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: tgbotphp-*.tar.gz
        sbom-path: tgbotphp.spdx.json
    - name: Copia il bundle di firma tra gli asset
      env:
        BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      run: cp "$BUNDLE" tgbotphp.intoto.jsonl
    - name: Carica gli artefatti per la release
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-assets
        path: |
          tgbotphp-*.tar.gz
          tgbotphp-*.checksums.txt
          tgbotphp.spdx.json
          tgbotphp.cyclonedx.json
          tgbotphp.intoto.jsonl

  publish:
    name: Publish
    needs: [verify, artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Scarica gli artefatti firmati
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-assets
        path: dist
    - name: Release notes from the CHANGELOG
      env:
        TAG: ${{ github.ref_name }}
      run: awk -v version="${TAG#v}" '$0 ~ "^## \\[" { printing = index($0, "[" version "]") > 0; next } printing' CHANGELOG.md > notes.md
    - name: Create the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag dist/*
