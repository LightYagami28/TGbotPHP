name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: '8.4'
        coverage: none
        tools: composer
    - run: composer install --no-interaction --no-progress
    - name: The tag matches ApiClient::VERSION
      env:
        TAG: ${{ github.ref_name }}
      run: |
        version="$(php -r 'require "vendor/autoload.php"; echo TGbotPHP\Core\ApiClient::VERSION;')"
        test "v$version" = "$TAG" || { echo "::error::Tag $TAG does not match ApiClient::VERSION $version"; exit 1; }
    - name: The CHANGELOG has a section for this version
      env:
        TAG: ${{ github.ref_name }}
      run: grep -q "^## \[${TAG#v}\]" CHANGELOG.md || { echo "::error::No CHANGELOG section for ${TAG#v}"; exit 1; }
    - run: vendor/bin/phpunit
    - run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Release notes from the CHANGELOG
      env:
        TAG: ${{ github.ref_name }}
      run: awk -v version="${TAG#v}" '$0 ~ "^## \\[" { printing = index($0, "[" version "]") > 0; next } printing' CHANGELOG.md > notes.md
    - name: Create the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
