# Version updates. Dependabot security updates (advisory pull requests) are a
# repository setting: Settings → Code security → Dependabot security updates,
# with Dependency graph and Dependabot alerts. An administrator has to enable
# them. Once enabled, the ecosystems below also scope those security updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5

  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
